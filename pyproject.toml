# pyproject.toml — tệp cấu hình dự án Python.
# Dùng để: khai báo metadata + dependencies của dự án, và cấu hình pytest
# (pythonpath, testpaths) để chạy kiểm thử từ thư mục gốc.
[project]
name = "ekyc-face-pad"
version = "0.1.0"
description = "Face Presentation Attack Detection (PAD) for facial eKYC"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "opencv-python>=4.8.0",
    "albumentations>=1.3.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "seaborn>=0.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
