# configs/clean.yaml — cấu hình thí nghiệm huấn luyện clean baseline (E01).
# Pipeline: dataset -> split -> MobileNetV2 -> huấn luyện -> đánh giá trên dữ liệu sạch.
seed: 123

dataset:
  name: celeba_spoof
  root: data/raw/celeba_spoof

split:
  strategy: subject_disjoint

model:
  name: mobilenet_v2
  image_size: 224

training:
  epochs: 20
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 4

loss:
  name: bce_with_logits
  use_pos_weight: false

evaluation:
  threshold: 0.5

device:
  name: auto
